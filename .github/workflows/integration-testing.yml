name: Integration Tests

on:
  schedule:
    # Runs at 00:00 UTC every night (translate to your timezone)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows you to trigger this manually from GitHub UI

env:
  GO_VERSION: stable
  GOLANGCI_LINT_VERSION: v2.12

jobs:
  integration-test:
    name: Run Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install Dependencies
        run: go mod download

      - name: Run Integration Tests
        run: go test -tags=integration -v ./internal/database/...
